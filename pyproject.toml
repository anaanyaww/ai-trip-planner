[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai_trip_planner"
version = "0.1.0"
description = "Multi-agent travel planning service with human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["travel", "multi-agent", "langgraph", "fastapi", "human-in-the-loop"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "diskcache>=5.6.3",
    "cachetools>=5.5.0",
    "jinja2>=3.1.4",
    "structlog>=24.4.0",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-cachetools>=5.5.0",
]

[project.urls]
Repository = "https://github.com/anaanyaww/ai-trip-planner"

[tool.hatch.build.targets.wheel]
packages = ["src/itinera"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "N",    # pep8-naming
    "D",    # pydocstyle
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401", # allow typing.Any where genuinely needed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "D100", "ANN201", "ANN001"]
# Migrations are generated by Alembic and are a record of what was applied.
# Reformatting them to satisfy style rules would edit history for no benefit.
"src/itinera/persistence/migrations/**" = ["D", "ANN", "N", "E501", "UP", "W291", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["diskcache.*", "langgraph.*", "langchain_groq.*", "langchain_google_genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=itinera --cov-report=term-missing"
markers = [
    "integration: tests exercising the FastAPI app end to end (no network)",
]

[tool.coverage.run]
source = ["src/itinera"]
omit = ["*/migrations/*", "*/__init__.py"]
